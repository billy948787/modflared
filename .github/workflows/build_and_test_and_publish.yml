name: build_and_test_and_publish
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - src/**
      - build.gradle
      - gradle.properties
jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit
  build_publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: gradle
      - name: "Upload to CurseForge"
        shell: bash
        run: |
          echo "Generating changelog from the latest commit..."
          export CHANGELOG_FILE=$(mktemp)
          git log -1 --pretty=format:"- %s (%h) - %an" > "$CHANGELOG_FILE"

          echo "CHANGELOG_FILE=${CHANGELOG_FILE}" >> $GITHUB_ENV
          
          chmod +x ./gradlew && ./gradlew --build-cache --info --stacktrace assemble publish -x test
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
